# Milena D'Argenzio - Netlify config
# Στατικό site, χωρίς build step στο Netlify.
# Οι σελίδες nyfiko/<κωδικός>/ γράφονται τοπικά με «node build.js» και ανεβαίνουν έτοιμες.

[build]
  publish = "."

# Φωτογραφίες: 1 ημέρα στη μνήμη του browser (αλλάζουν ακόμα συχνά). Βίντεο: 7 ημέρες.
# Τα ονόματα αρχείων ξαναχρησιμοποιούνται όταν αλλάζει μια φωτογραφία, άρα μια νέα
# φωτογραφία μπορεί να χρειαστεί έως 1 ημέρα για να φανεί σε επισκέπτη που ξαναέρχεται.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Βασικές κεφαλίδες ασφαλείας για όλες τις σελίδες.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Νυφικά εκτός δημόσιας θέας ("hidden": true στο data.json, εντολή 07-10).
# Οι φωτογραφίες τους μένουν στο repo αλλά δεν σερβίρονται: 404 με τη σελίδα 404.html.
# Επαναφορά: σβήνεται η σημαία στο data.json, σβήνονται αυτές οι γραμμές, node build.js.
[[redirects]]
  from = "/photos/007/*"
  to = "/404.html"
  status = 404
  force = true
